name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on an iOS simulator
        run: |
          xcodebuild test \
            -scheme Carillon \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation
